name: CI

on:
  release:
    types: [published]

  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  plugin:
    name: Build Endstone plugin wheel
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel --outdir dist Plugin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: endstone-multivoice
          path: dist/*.whl

      # On a release the wheel is also attached to the release itself, so servers can pip install its URL.
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.whl --clobber --repo "${{ github.repository }}"
