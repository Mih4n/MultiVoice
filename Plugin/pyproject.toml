[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-multivoice"
version = "0.1.0"
description = "Sends player positions to the MultiVoice server and confirms web logins."
dependencies = ["signalrcore>=1.0.2"]

[project.entry-points."endstone"]
multivoice = "endstone_multivoice:MultiVoicePlugin"
